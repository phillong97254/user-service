name: "go-admin-wallet-user-service"
# Chạy riêng service này trong Docker (make up). Các service khác chạy trên máy (go run)
# hoặc container khác, gọi qua host.docker.internal. Chạy cả hệ thống: docker-compose.yml ở thư mục gốc.
services:
  user-service:
    container_name: user-service-${ENV:-dev}
    image: ${REGISTRY:-ghcr.io/phillong97254}/user-service:${TAG:-dev-latest}
    build:
      context: .
    ports:
      - "8082:8082"
    environment:
      REST_SERVER_ADDR: ":8082"
      OAUTH_JWKS_URL: http://host.docker.internal:9000/.well-known/jwks.json
      DB_URL: postgres://users:${DB_PASSWORD:?đặt trong .env (xem .env.example)}@postgres:5432/user_db?sslmode=disable
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - user-service-network

  # Postgres riêng của service (database-per-service). Dữ liệu ở ./tmp/postgres_data (không commit).
  postgres:
    container_name: user-service-postgres-${ENV:-dev}
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: users
      POSTGRES_PASSWORD: ${DB_PASSWORD:?đặt trong .env (xem .env.example)}
      POSTGRES_DB: user_db
      TZ: UTC
    volumes:
      - ./tmp/postgres_data:/var/lib/postgresql/data
    ports:
      - "54324:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U users -d user_db"]
      interval: 2s
      timeout: 3s
      retries: 15
    restart: unless-stopped
    networks:
      - user-service-network

networks:
  user-service-network:
    driver: bridge
